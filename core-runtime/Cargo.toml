[package]
name = "melon-core"
version = "0.1.0"
edition = "2021"
description = "Deterministic dataflow runtime for the Melon agentic office"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
